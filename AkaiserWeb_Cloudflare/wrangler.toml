name = "akaiser-account"
main = "worker/index.mjs"
compatibility_date = "2025-09-01"

# The website pages. Only /api/* runs the Worker code.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Database. No database_id needed: Cloudflare creates the D1 database on the first deploy.
[[d1_databases]]
binding = "DB"
database_name = "akaiser-db"

# Daily cleanup of expired sessions / counters
[triggers]
crons = ["17 3 * * *"]

[vars]
MAX_DEVICES = "5"
GACHA_UTC_OFFSET_MIN = "0"
